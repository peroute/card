<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahmoud Bouassida · CEO, Sté Yasmine</title>
<meta name="description" content="Mahmoud Bouassida, CEO of Sté Yasmine de développement et exploitation agricole. Agricultural expert and consultant with 20+ years in citrus, apples, grapes and agricultural projects. Takelsa, Nabeul, Tunisia.">

<meta property="og:type" content="profile">
<meta property="og:title" content="Mahmoud Bouassida · CEO, Sté Yasmine">
<meta property="og:description" content="Agricultural expert and consultant · Citrus, apples, grapes · 20+ years in the field · Takelsa, Nabeul, Tunisia">

<style>
  /* ---------- Theme ---------- */
  :root {
    --bg: #eeece4;
    --card: #fcfbf7;
    --text: #1d2219;
    --muted: #5d6356;
    --line: #e2e0d5;
    --brand: #24432d;        /* deep orchard green */
    --brand-2: #2f5839;
    --on-brand: #f4f2e9;
    --accent: #b5832f;       /* harvest ochre, used sparingly */
    --chip: #eef0e6;
    --chip-text: #34492f;
    --btn: #f3f2ec;
    --btn-hover: #e9e8df;
    --focus: #b5832f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f130f;
      --card: #171c16;
      --text: #ebede4;
      --muted: #a3a898;
      --line: #2a3127;
      --brand: #1f3a27;
      --brand-2: #284a32;
      --on-brand: #eef0e4;
      --accent: #d6a24c;
      --chip: #222a1f;
      --chip-text: #c5d6b5;
      --btn: #1f251d;
      --btn-hover: #273024;
      --focus: #d6a24c;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Arabic", "Geeza Pro", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  main {
    width: 100%; max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,30,15,.04), 0 12px 32px -12px rgba(20,30,15,.18);
  }

  /* ---------- Header: orchard rows seen from above ---------- */
  header {
    position: relative;
    height: 92px;
    background: var(--brand);
    color: var(--on-brand);
  }
  header svg.rows { position: absolute; inset: 0; width: 100%; height: 100%; }
  header svg.rows line { stroke: var(--on-brand); stroke-opacity: .09; stroke-width: 1.2; }
  header svg.rows circle { fill: var(--on-brand); fill-opacity: .10; }

  .lang {
    position: absolute; top: 14px; inset-inline-end: 14px;
    display: flex; gap: 2px;
    background: rgba(0,0,0,.18);
    border-radius: 999px; padding: 3px;
  }
  .lang button {
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--on-brand); opacity: .75;
    background: none; border: 0; cursor: pointer;
    min-width: 34px; height: 28px; padding: 0 8px; border-radius: 999px;
  }
  .lang button[aria-pressed="true"] { background: var(--on-brand); color: var(--brand); opacity: 1; }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .no-js .lang { display: none; }

  .mono {
    position: absolute; bottom: -32px; inset-inline-start: 22px;
    width: 70px; height: 70px; border-radius: 50%;
    background: var(--card);
    border: 4px solid var(--card);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .mono span {
    width: 100%; height: 100%; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--brand-2); color: var(--on-brand);
    font-size: 24px; font-weight: 700; letter-spacing: .5px;
  }
  .mono img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  /* ---------- Identity ---------- */
  .body { padding: 44px 22px 22px; }
  h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.4px; }
  .role { margin-top: 6px; font-size: 17px; font-weight: 600; color: var(--brand-2); }
  .company { margin-top: 2px; font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; text-wrap: balance; }
  @media (prefers-color-scheme: dark) { .role { color: #b9cfa5; } }
  .sub { margin-top: 8px; font-size: 15px; color: var(--muted); line-height: 1.45; }
  .where { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .where svg { width: 16px; height: 16px; flex: none; }

  /* ---------- Credentials strip ---------- */
  .facts {
    margin-top: 16px; padding: 14px 0;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .years { display: flex; align-items: baseline; gap: 8px; }
  .years b { font-size: 28px; line-height: 1; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }
  .years small { font-size: 14px; line-height: 1.25; color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li {
    list-style: none;
    font-size: 13.5px; font-weight: 600; line-height: 1;
    padding: 7px 11px; border-radius: 999px; white-space: nowrap;
    background: var(--chip); color: var(--chip-text);
  }

  /* ---------- Actions ---------- */
  .actions { margin-top: 18px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 0 14px; border-radius: 14px;
    background: var(--btn); border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    font-size: 15px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s ease, transform .1s ease;
  }
  .row a.btn { flex-direction: column; gap: 5px; min-height: 68px; font-size: 13px; }
  a.btn:hover { background: var(--btn-hover); }
  a.btn:active { transform: scale(.98); }
  a.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  a.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-size: 17px; min-height: 56px; }
  a.btn.primary:hover { background: var(--brand-2); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .wa svg { color: #1f9d55; }
  @media (prefers-color-scheme: dark) {
    .wa svg { color: #4cc27f; }
    a.btn.primary { background: #a3c585; border-color: #a3c585; color: #142012; }
    a.btn.primary:hover { background: #b2d095; }
    .mono span { background: #3b6344; }
  }


  /* ---------- RTL tweaks ---------- */
  [dir="rtl"] body, [dir="rtl"] { font-family: "Noto Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif; }
  [dir="rtl"] h1 { letter-spacing: 0; }
  [dir="rtl"] .chips li { font-size: 14.5px; }
</style>
</head>

<script>
(function () {
  var T = {
    en: { role: "CEO", sub: "Agricultural expert & consultant", where: "Takelsa, Nabeul, Tunisia",
          years: "years in the field", c1: "Citrus", c2: "Apples", c3: "Grapes",
          save: "Save contact", wa: "WhatsApp", call: "Call", email: "Email" },
    fr: { role: "Gérant", sub: "Expert et consultant agricole", where: "Takelsa, Nabeul, Tunisie",
          years: "ans d’expérience terrain", c1: "Agrumes", c2: "Pommiers", c3: "Vigne",
          save: "Enregistrer le contact", wa: "WhatsApp", call: "Appeler", email: "E-mail" },
    ar: { role: "المسيّر", sub: "خبير ومستشار فلاحي", where: "تاكلسة، نابل، تونس",
          years: "سنة من الخبرة الميدانية", c1: "القوارص", c2: "التفاح", c3: "العنب",
          save: "حفظ جهة الاتصال", wa: "واتساب", call: "اتصال", email: "البريد" }
  };
  var root = document.documentElement;
  document.body.classList.remove("no-js");

  function apply(lang) {
    if (!T[lang]) lang = "en";
    var t = T[lang];
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll("[data-set-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.setLang === lang));
    });
  }

  var saved = null;
  try { saved = localStorage.getItem("card-lang"); } catch (e) {}
  var nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  apply(saved || (T[nav] ? nav : "en"));

  document.querySelectorAll("[data-set-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      apply(b.dataset.setLang);
      try { localStorage.setItem("card-lang", b.dataset.setLang); } catch (e) {}
    });
  });
})();
</script>

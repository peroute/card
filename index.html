<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahmoud Bouassida</title>
<meta name="description" content="Mahmoud Bouassida, agricultural expert and consultant. 20+ years of experience with citrus, apples, grapes and agricultural projects.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e7eadb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121710" media="(prefers-color-scheme: dark)">
<style>
  /* ---- Theme: edit colors here. Dark mode overrides are below. ---- */
  :root {
    --bg: #e7eadb;          /* sage */
    --card: #fafaf4;
    --text: #2a2a1f;        /* dark loam */
    --muted: #66654f;
    --line: #d9dcc8;
    --primary: #2f5d3a;     /* leaf green */
    --primary-text: #f6f7ee;
    --btn: #eff1e4;
    --btn-hover: #e4e8d4;
    --focus: #e8891c;
    --crops: #3f6b35;       /* "Citrus, apples, grapes..." line */

    /* Orchard illustration */
    --band: #dde6cc;        /* orchard background */
    --grass: #c9d8b0;
    --orange: #e8891c;
    --orange-flesh: #f4a23a;
    --pith: #fce7c2;
    --lemon: #efc93a;
    --apple: #c8372d;
    --grape: #6b3a6e;
    --grape-2: #82508a;
    --leaf: #5e8f3e;
    --stem: #6b4a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121710;
      --card: #1a2017;
      --text: #e9ebdd;
      --muted: #a3a68e;
      --line: #2c3427;
      --primary: #8fb86f;
      --primary-text: #142012;
      --btn: #242c20;
      --btn-hover: #2d3628;
      --focus: #f0a04a;
      --crops: #a9c98c;

      --band: #202a1c;
      --grass: #283522;
      --orange: #d07a1a;
      --orange-flesh: #dc9033;
      --pith: #e6d3ad;
      --lemon: #d4b334;
      --apple: #b0322a;
      --grape: #5e3462;
      --grape-2: #73467a;
      --leaf: #4f7a35;
      --stem: #8a6a48;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }

  /* Orchard illustration: citrus, apple, grapes */
  .orchard { display: block; width: 100%; height: auto; }
  .orchard .band { fill: var(--band); }
  .orchard .grass { fill: var(--grass); }
  .orchard .orange { fill: var(--orange); }
  .orchard .flesh { fill: var(--orange-flesh); }
  .orchard .pith { fill: var(--pith); }
  .orchard .divide { stroke: var(--pith); stroke-width: 2.5; stroke-linecap: round; }
  .orchard .lemon { fill: var(--lemon); }
  .orchard .apple { fill: var(--apple); }
  .orchard .grape { fill: var(--grape); }
  .orchard .grape-2 { fill: var(--grape-2); }
  .orchard .leaf { fill: var(--leaf); }
  .orchard .stem { fill: none; stroke: var(--stem); stroke-width: 3; stroke-linecap: round; }
  .orchard .shine { fill: #ffffff; opacity: .22; }

  /* One load moment: the three fruits rise in, left to right. */
  .orchard .fruit { animation: rise .7s cubic-bezier(.2, .7, .3, 1) both; }
  .orchard .fruit:nth-of-type(2) { animation-delay: .12s; }
  .orchard .fruit:nth-of-type(3) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .orchard .fruit { animation: none; } }

  .body { padding: 26px 24px 24px; }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: 34px;
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .title { margin-top: 8px; color: var(--text); font-size: 17px; line-height: 1.4; }
  .exp { margin-top: 2px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .crops { margin-top: 14px; color: var(--crops); font-size: 15px; font-weight: 600; line-height: 1.45; text-wrap: balance; }

  .actions { margin-top: 26px; display: grid; gap: 10px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px;
    padding: 0 16px;
    border-radius: 12px;
    background: var(--btn);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-size: 16px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s ease, transform .1s ease;
  }
  a.btn:hover { background: var(--btn-hover); }
  a.btn:active { transform: scale(0.98); }
  a.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  a.btn.primary {
    background: var(--primary); border-color: var(--primary);
    color: var(--primary-text); font-size: 17px; min-height: 56px;
  }
  a.btn.primary:hover { filter: brightness(1.08); }
  .btn svg { width: 20px; height: 20px; flex: none; }

  .note { margin-top: 20px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <!-- Orchard illustration: citrus, apple, grapes. Colors come from the CSS variables above. -->
  <svg class="orchard" viewBox="0 0 400 150" aria-hidden="true" focusable="false">
    <rect class="band" width="400" height="150"/>
    <rect class="grass" y="128" width="400" height="22"/>

    <!-- Citrus: a whole lemon behind a cut orange showing its segments -->
    <g class="fruit">
      <ellipse class="lemon" cx="52" cy="62" rx="22" ry="16" transform="rotate(-25 52 62)"/>
      <circle class="orange" cx="84" cy="84" r="36"/>
      <circle class="pith" cx="84" cy="84" r="32"/>
      <circle class="flesh" cx="84" cy="84" r="29"/>
      <path class="divide" d="M84 84V55M84 84V113M84 84H55M84 84H113M84 84L63.5 63.5M84 84L104.5 63.5M84 84L63.5 104.5M84 84L104.5 104.5"/>
      <circle class="pith" cx="84" cy="84" r="4"/>
    </g>

    <!-- Apple -->
    <g class="fruit">
      <path class="apple" d="M200 64C188 54 166 58 164 82C162 106 182 124 194 120C198 119 202 119 206 120C218 124 238 106 236 82C234 58 212 54 200 64Z"/>
      <path class="stem" d="M200 64C200 56 202 50 205 46"/>
      <path class="leaf" d="M205 50C212 38 228 37 233 43C225 53 212 56 205 50Z"/>
      <ellipse class="shine" cx="179" cy="78" rx="5" ry="10" transform="rotate(-20 179 78)"/>
    </g>

    <!-- Grapes on the vine -->
    <g class="fruit">
      <path class="stem" d="M320 48C321 42 324 38 332 38"/>
      <path class="leaf" d="M330 40C334 26 350 21 358 29C367 29 370 40 364 46C366 55 353 59 347 53C339 55 330 49 330 40Z"/>
      <circle class="grape" cx="293" cy="58" r="9.5"/>
      <circle class="grape-2" cx="311" cy="58" r="9.5"/>
      <circle class="grape" cx="329" cy="58" r="9.5"/>
      <circle class="grape-2" cx="347" cy="58" r="9.5"/>
      <circle class="grape-2" cx="302" cy="74" r="9.5"/>
      <circle class="grape" cx="320" cy="74" r="9.5"/>
      <circle class="grape-2" cx="338" cy="74" r="9.5"/>
      <circle class="grape" cx="311" cy="90" r="9.5"/>
      <circle class="grape-2" cx="329" cy="90" r="9.5"/>
      <circle class="grape" cx="320" cy="106" r="9.5"/>
    </g>
  </svg>

  <div class="body">
    <h1>Mahmoud Bouassida</h1>
    <p class="title">Agricultural expert and consultant</p>
    <p class="exp">20+ years of experience</p>
    <p class="crops">Citrus, apples, grapes and agricultural projects</p>

    <div class="actions">
      <!-- Save contact: opens the native "Add to Contacts" sheet on iOS / Android. -->
      <a class="btn primary" href="mahmoud.vcf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Save contact
      </a>

      <!-- EMAIL: change the address after "mailto:" (also in mahmoud.vcf) -->
      <a class="btn" href="mailto:mahmoud.bouassida@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        Email
      </a>
    </div>

    <p class="note">Tap “Save contact” to add me to your phone.</p>
  </div>
</main>
</body>
</html>

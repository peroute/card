<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedi Bouassida</title>
<meta name="description" content="Hedi Bouassida · Computer Science · Texas Tech University">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<style>
  /* ---- Theme: edit colors here. Dark mode overrides are below. ---- */
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #18181b;
    --muted: #6b6b70;
    --line: #e6e4df;
    --accent: #cc0000;        /* Texas Tech red */
    --accent-text: #ffffff;
    --btn: #f1efeb;
    --btn-hover: #e8e5df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1c1c1e;
      --text: #f2f2f2;
      --muted: #a1a1a6;
      --line: #2c2c2e;
      --accent: #e0302f;
      --accent-text: #ffffff;
      --btn: #2a2a2d;
      --btn-hover: #343438;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 24px 28px;
    text-align: center;
  }
  .avatar {
    width: 84px; height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    display: grid; place-items: center;
    font-size: 30px; font-weight: 600; letter-spacing: 1px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .title { margin-top: 6px; color: var(--muted); font-size: 15px; }

  .actions { margin-top: 32px; display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px;
    padding: 0 16px;
    border-radius: 14px;
    background: var(--btn);
    color: var(--text);
    text-decoration: none;
    font-size: 16px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .15s ease, transform .1s ease;
  }
  a.btn:hover { background: var(--btn-hover); }
  a.btn:active { transform: scale(0.98); }
  a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.btn.primary { background: var(--accent); color: var(--accent-text); font-size: 17px; min-height: 58px; }
  a.btn.primary:hover { filter: brightness(1.08); }
  svg { width: 20px; height: 20px; flex: none; }

  footer { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="avatar" aria-hidden="true">HB</div>
  <h1>Hedi Bouassida</h1>
  <p class="title">Computer Science · Texas Tech University</p>

  <div class="actions">
    <!-- Save contact: opens the native "Add to Contacts" sheet on iOS / Android. -->
    <a class="btn primary" href="hedi.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Save contact
    </a>

    <div class="row">
      <!-- PHONE: edit the number after "tel:" (no spaces, include +country code) -->
      <a class="btn" href="tel:+15555550100">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call
      </a>
      <a class="btn" href="https://www.linkedin.com/in/hedi-bouassida" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        LinkedIn
      </a>
    </div>

    <!-- EMAIL: to add an email button, uncomment this block and put your address after "mailto:"
    <a class="btn" href="mailto:you@example.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
      Email
    </a>
    -->
  </div>

  <footer>Tap “Save contact” to add me to your phone.</footer>
</main>
</body>
</html>
